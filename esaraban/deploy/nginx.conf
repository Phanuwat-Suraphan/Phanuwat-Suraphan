# Reverse proxy for e-Saraban. Replace esaraban.example.com before use.
# After DNS points at this server, run: sudo certbot --nginx -d esaraban.example.com
# (certbot rewrites this file to add the SSL block + HTTP->HTTPS redirect automatically)

server {
    listen 80;
    server_name esaraban.example.com;

    client_max_body_size 15m; # base64-encoded PDF uploads, up to ~10MB files

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # security headers (Part 3 requirement: HSTS/CSP/X-Frame-Options etc.)
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
