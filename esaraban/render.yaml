services:
  - type: web
    name: esaraban
    runtime: docker # ต้องใช้ Docker ไม่ใช่ Node เพราะ OCR + ประทับตราลง PDF จริงต้องมี
    # tesseract/poppler-utils/chromium/qpdf บนเซิร์ฟเวอร์ (apt install ได้เฉพาะบน Docker runtime
    # เท่านั้น — Node runtime ธรรมดาของ Render ไม่อนุญาต) ดู esaraban/Dockerfile และ
    # deploy/RENDER.md หัวข้อ "Docker runtime"
    plan: free
    rootDir: esaraban
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
    healthCheckPath: /login
